<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Giriş | İSG Eğitim Portalı</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-protected="false" data-depth="0">

<div class="login-page">
  <div class="login-box">
    <div class="login-logo">KT</div>
    <div style="text-align:center">
      <div class="course-code">KONYA TEKNİK ÜNİVERSİTESİ</div>
      <h1 style="font-size:28px;margin:8px 0">İSG Eğitim Portalı</h1>
      <p class="muted">2026–2027 Tezsiz Yüksek Lisans</p>
    </div>

    <form id="loginForm">
      <div class="field">
        <label for="username">Kullanıcı Adı</label>
        <input id="username" autocomplete="username" required>
      </div>

      <div class="field">
        <label for="password">Şifre</label>
        <input id="password" type="password" autocomplete="current-password" required>
      </div>

      <button class="btn btn-primary" style="width:100%" type="submit">Giriş Yap</button>
      <div id="loginError" class="error"></div>
    </form>

    <p class="muted" style="font-size:11px;margin-top:18px">
      Demo kullanıcı adı: <strong>sirac</strong><br>
      Demo şifre: <strong>2026ISG</strong>
    </p>
  </div>
</div>

<script src="assets/js/app.js"></script>
</body>
</html>
